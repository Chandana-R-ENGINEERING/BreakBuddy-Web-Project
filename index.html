<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BreakBuddy</title>
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
  body {
    font-family: "Poppins", sans-serif;
    text-align: center;
    transition: background 1s;
    background: linear-gradient(135deg, #a3d8f4, #f9f9f9);
    margin: 0;
    overflow: hidden;
  }
  h1 {
    margin-top: 50px;
    color: #333;
  }
  p {
    color: #555;
  }
  #controls button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
    background: #4CAF50;
    color: white;
  }
  #status {
    font-size: 18px;
    margin-top: 20px;
  }
  #breakScreen {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #FFD3A5, #FD6585);
    color: white;
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #breakScreen h2 {
    font-size: 28px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <h1>💞 BreakBuddy</h1>
  <p>Our smart break reminder encourages healthy digital habits for everyone 🌿</p>

  <div id="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" style="display:none;">Stop</button>
  </div>
  <div id="status">Timer stopped</div>

  <!-- Full-screen Break Mode -->
  <div id="breakScreen">
    <h2>Take a Break! 🌼</h2>
    <lottie-player id="breakAnim"
      src="https://lottie.host/13e38d3e-5b55-4890-bb21-b5ac249ad4d2/MRhHTYJkOg.json"
      background="transparent"
      speed="1"
      style="width: 300px; height: 300px;"
      loop autoplay>
    </lottie-player>
    <p>Stretch a bit, hydrate yourself 💧</p>
  </div>

<script>
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const status = document.getElementById("status");
const breakScreen = document.getElementById("breakScreen");
let timerId = null;
let running = false;
let focus = true;

// fun sound
const breakSound = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");

function showNotification(message){
  if (Notification.permission === "granted"){
    new Notification("BreakBuddy", {body: message, icon: "https://i.imgur.com/0LxZkTt.png"});
  }
}

function toggleBreak(){
  if (!focus){
    // back to focus
    breakScreen.style.display = "none";
    document.body.style.background = "linear-gradient(135deg, #a3d8f4, #f9f9f9)";
    focus = true;
    status.textContent = "Focus time 💻";
  } else {
    // show break
    breakScreen.style.display = "flex";
    document.body.style.background = "linear-gradient(135deg, #FFD3A5, #FD6585)";
    breakSound.play();
    showNotification("Time for a quick stretch!");
    focus = false;
    status.textContent = "Break time 🌼";
    setTimeout(toggleBreak, 10000); // stay on break for 10s
    return;
  }
  timerId = setTimeout(toggleBreak, 10000); // every 10s show break
}

startBtn.onclick = () => {
  if (!running){
    running = true;
    status.textContent = "Focus time 💻";
    startBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
    if (Notification.permission !== "granted") Notification.requestPermission();
    toggleBreak();
  }
};

stopBtn.onclick = () => {
  running = false;
  clearTimeout(timerId);
  timerId = null;
  focus = true;
  breakScreen.style.display = "none";
  document.body.style.background = "linear-gradient(135deg, #a3d8f4, #f9f9f9)";
  status.textContent = "Timer stopped";
  startBtn.style.display = "inline-block";
  stopBtn.style.display = "none";
};
</script>
</body>
</html>
